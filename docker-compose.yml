# Local dev/demo stack, visible as a "pizza" project in Docker Desktop: `docker compose up
# --build`. Not a deployment config — see README.md's "Running locally" for the non-Docker
# alternative used for day-to-day dev with hot reload.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pizzashop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pizzashop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: src/PizzaShop.Api/Dockerfile
    environment:
      # Development so the app picks up appsettings.Development.json (dev JWT signing key,
      # SuperAdmin seed credentials, Cors:Origins/PayU:ContinueUrl already set to
      # http://localhost:5173, which is where the frontend service is published below).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=pizzashop;Username=postgres;Password=postgres"
      # PayU's public PLN sandbox test POS (no registration needed, no real secret — published
      # at https://developers.payu.com/europe/docs/testing/sandbox/). Swap for a real sandbox
      # account's credentials if you register one instead.
      PayU__PosId: "300746"
      PayU__ClientId: "300746"
      PayU__ClientSecret: "2ee86a66e5d97e3fadc400c9f19b065d"
      PayU__SecondKey: "b6ca15b0d1020e8094d9b5f8d163db54"
    ports:
      - "5105:8080"
    volumes:
      - pizzashop-uploads:/app/wwwroot/uploads/menu-items
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pizzashop-postgres-data:
  pizzashop-uploads:
